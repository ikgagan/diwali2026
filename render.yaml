# Render Blueprint for the backend. In Render: New > Blueprint > pick this repo.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: diwali-photos-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_FOLDER_ID
        value: 1wV-77g0hQcs3SFf-OZYM1sZd---WQ3LS
      - key: DRIVE_FOLDER_LINK
        value: https://drive.google.com/drive/folders/1wV-77g0hQcs3SFf-OZYM1sZd---WQ3LS
      - key: CORS_ORIGINS
        value: https://ikgagan.github.io
      - key: GALLERY_ROTATE_MINUTES
        value: "20"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: EVENT_PASSCODE
        sync: false
      - key: ADMIN_TOKEN
        sync: false
